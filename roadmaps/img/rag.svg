<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img" aria-label="RAG roadmap, five steps">
  <rect width="1200" height="640" fill="#FAF7F2"/>
  <line x1="48" y1="48" x2="1152" y2="48" stroke="#E4DDD2" stroke-width="1"/>
  <text x="48" y="92" fill="#6A6158" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">RAG</text>
  <text x="48" y="138" fill="#1F1B16" font-family="Georgia, Times New Roman, serif" font-size="34">From a document to a grounded answer</text>
  <text x="48" y="176" fill="#6A6158" font-family="Georgia, Times New Roman, serif" font-size="18">Five steps. Each one is a system choice, not a library name.</text>

  <line x1="108" y1="360" x2="1092" y2="360" stroke="#1F1B16" stroke-width="1.5"/>

  <g font-family="Georgia, Times New Roman, serif" text-anchor="middle">
    <circle cx="108" cy="360" r="22" fill="#FAF7F2" stroke="#9A4A2A" stroke-width="2"/>
    <text x="108" y="367" fill="#9A4A2A" font-size="16">1</text>
    <text x="108" y="430" fill="#1F1B16" font-size="20">Chunk</text>
    <text x="108" y="458" fill="#6A6158" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">split sources</text>

    <circle cx="354" cy="360" r="22" fill="#FAF7F2" stroke="#9A4A2A" stroke-width="2"/>
    <text x="354" y="367" fill="#9A4A2A" font-size="16">2</text>
    <text x="354" y="430" fill="#1F1B16" font-size="20">Index</text>
    <text x="354" y="458" fill="#6A6158" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">store + metadata</text>

    <circle cx="600" cy="360" r="22" fill="#FAF7F2" stroke="#9A4A2A" stroke-width="2"/>
    <text x="600" y="367" fill="#9A4A2A" font-size="16">3</text>
    <text x="600" y="430" fill="#1F1B16" font-size="20">Retrieve</text>
    <text x="600" y="458" fill="#6A6158" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">find passages</text>

    <circle cx="846" cy="360" r="22" fill="#FAF7F2" stroke="#9A4A2A" stroke-width="2"/>
    <text x="846" y="367" fill="#9A4A2A" font-size="16">4</text>
    <text x="846" y="430" fill="#1F1B16" font-size="20">Ground</text>
    <text x="846" y="458" fill="#6A6158" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">answer from hits</text>

    <circle cx="1092" cy="360" r="22" fill="#FAF7F2" stroke="#9A4A2A" stroke-width="2"/>
    <text x="1092" y="367" fill="#9A4A2A" font-size="16">5</text>
    <text x="1092" y="430" fill="#1F1B16" font-size="20">Harden</text>
    <text x="1092" y="458" fill="#6A6158" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">access and eval</text>
  </g>

  <text x="48" y="580" fill="#6A6158" font-family="Georgia, Times New Roman, serif" font-size="16">The model never sees the whole handbook. It sees the passages you retrieved.</text>
</svg>
